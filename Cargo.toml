[package]
name = "rustbot"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Native Rust port of Hugging Face PyBot's rule-based conversation engine"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
mt19937 = "3.3"
getrandom = "0.4"
rand_core = "0.10"
regex = "1"
rustyline = "18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11", default-features = false }
unicode-normalization = "0.1"
fancy-regex = "0.18"
jiff = "0.2.46"
num-bigint = "0.4.6"
num-rational = "0.4.2"
num-traits = "0.2.19"

[profile.release]
strip = "debuginfo"
